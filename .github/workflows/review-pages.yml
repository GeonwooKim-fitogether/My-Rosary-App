# 검수용 설치형 웹앱을 GitHub Pages 에 올린다.
#
# 이 워크플로는 **사람이나 Claude 가 버튼을 눌러야만** 돈다(workflow_dispatch). 자동으로는
# 절대 돌지 않고, 게다가 입력칸에 `publish` 라고 정확히 적어야 빌드가 시작된다. 인터넷에
# 공개하는 일은 사람 관문이기 때문이다(.claude/rules/escalation.md §2 여섯째 트리거,
# decisions.md 결정 12-1). 공방장은 2026-09-20 에 검수용 공개를 승인했다.
#
# 올라가면 https://<계정>.github.io/My-Rosary-App/ 에서 열리고, 폰에서 `홈 화면에 추가`
# 를 하면 주소창 없이 앱처럼 전체 화면으로 뜬다. 검색엔진에는 잡히지 않게 막아 둔다
# (robots.txt 와 noindex 표시를 빌드가 함께 넣는다).
#
# 내리는 법: 저장소 Settings → Pages → Source 를 None 으로 바꾸면 곧바로 사라진다.
name: 검수용 웹앱 게시

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '인터넷에 공개하는 것에 동의하면 publish 라고 적습니다'
        required: true
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: review-pages
  cancel-in-progress: true

jobs:
  build:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 글꼴 줄이기 도구
        run: python3 -m pip install --quiet fonttools brotli

      - name: 설치형 웹앱 빌드
        run: bash tools/build-review-pages.sh

      - name: 올릴 것이 갖춰졌는지 확인
        run: |
          set -e
          for f in index.html manifest.webmanifest sw.js robots.txt 404.html icons/icon-192.png; do
            test -s "dist/$f" || { echo "빠짐: dist/$f"; exit 1; }
          done
          grep -q 'noindex' dist/index.html || { echo "noindex 표시가 없다"; exit 1; }
          echo "확인 통과 — $(du -sh dist | cut -f1)"

      # Pages 를 처음 켜는 일은 이 워크플로의 자격으로 할 수 없다(실측: "Resource not
      # accessible by integration"). 저장소 Settings → Pages → Source 를 GitHub Actions
      # 로 한 번 바꿔 두어야 하며, 그 뒤로는 이 단계가 기존 설정을 읽기만 한다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
