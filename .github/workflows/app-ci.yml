# 앱 검사 — 타입 검사 · 단위 테스트 · 웹 빌드.
#
# 웹 빌드까지 여기서 도는 이유가 있다. 타입 검사와 단위 테스트가 모두 통과해도 번들이
# 깨지는 경우가 있는데, 이 저장소에서 웹 빌드는 화면을 눈으로 확인할 수 있는 유일한
# 통로다(맥이 없어 iOS 네이티브 빌드가 불가능하다). 그래서 깨지면 즉시 알아야 한다.
#
# 이 파일의 원본은 이 저장소다 — `.github/workflows/` 는 창고 동기화 봇이 내려보내지
# 않는 폴더이기 때문이다 (원본 우선 규칙의 예외 항목).
name: app-ci

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 타입 검사 · 테스트 · 웹 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      # 화면 사진 등록부 검사 — `docs/plan/screens.json` 과 실제 시험 코드를 맞대어 본다.
      # 새로 찍는 자리를 등재하지 않았거나, 얼린 자리를 찍는 시험이 생겼거나, 등록부에
      # 적힌 사진이 사라졌으면 여기서 막힌다. e2e 안의 감시(`e2e/support/harness.ts`)가
      # 실행 중에 막는다면 이 검사는 **아직 돌지 않은 코드**를 머지 전에 잡는다.
      - name: 화면 사진 등록부 검사
        run: npm run check:screens

      - name: 화면 사진 등록부 도구 시험
        run: node tools/screens-registry.test.cjs

      - name: 단위 테스트
        run: npm test

      - name: 웹 빌드
        run: npm run build:web

      # 화면 e2e 는 방금 만든 웹 빌드(`dist/`)를 띄워 실제 브라우저로 확인한다.
      # 기도 화면까지 눌러서 닿는지, 77단계를 스스로 완주하는지, 콘솔이 조용한지가
      # 여기서 걸린다. 브라우저는 이 단계에서 받아 온다 — 개발 컨테이너에는 이미
      # 깔려 있지만 CI 러너에는 없기 때문이다.
      - name: e2e 브라우저 받기
        run: npx playwright install --with-deps chromium

      - name: 화면 e2e (Playwright)
        run: npm run test:e2e

      # 화면이 어긋났을 때 눈으로 볼 수 있게 사진과 기록을 남긴다.
      - name: e2e 산출물 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-결과
          path: |
            docs/plan/m1-screens/
            docs/plan/m2-screens/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
