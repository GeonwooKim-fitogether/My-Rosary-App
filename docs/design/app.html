<!DOCTYPE html>
<html lang="ko" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>묵주 — MyRosary</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* MyRosary 앱 — 화면 시안(build.mjs)의 토큰·타이포·간격을 그대로 옮기고,
   글자 크기 배수(--fs)와 앱 셸(뷰포트 채움·폰 틀)만 더했다. 색은 변수로만 쓴다. */

/* ── 토큰 두 벌 ───────────────────────────────────────────────── */
html[data-theme="day"]{
  --bg:#EDE7D8; --surface:#F5F1E6; --surface2:#E2DAC7;
  --ink:#1F2530; --muted:#5C6272;
  --accent:#82600F; --accent-bg:rgba(130,96,15,.06); --accent-line:#82600F;
  --rule:rgba(31,37,48,.16); --rule2:rgba(31,37,48,.30); --faint:rgba(31,37,48,.10);
  --ash:rgba(31,37,48,.26);
  --season:#63507F;
  --fill:#1F2530; --on-fill:#F5F1E6; --on-fill-muted:#C9C2B0;
  --bead:#5C6272; --bead-line:rgba(31,37,48,.30); --thread:rgba(31,37,48,.22);
  --plate-veil:rgba(0,0,0,0);
  --scrim:rgba(31,37,48,.46);
}
html[data-theme="night"]{
  --bg:#10161F; --surface:#18202C; --surface2:#222C3B;
  --ink:#F0EAD9; --muted:#8E93A3;
  --accent:#D9AE4C; --accent-bg:rgba(217,174,76,.09); --accent-line:#D9AE4C;
  --rule:rgba(240,234,217,.14); --rule2:rgba(240,234,217,.30); --faint:rgba(240,234,217,.10);
  --ash:rgba(240,234,217,.22);
  --season:#9683B5;
  --fill:#DCD6C4; --on-fill:#10161F; --on-fill-muted:#3F4757;
  --bead:#8E93A3; --bead-line:rgba(240,234,217,.34); --thread:rgba(240,234,217,.24);
  --plate-veil:rgba(16,22,31,.56);
  --scrim:rgba(6,9,14,.62);
}

/* ── 앱 셸 ────────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#07090d;font-family:'Noto Sans KR',system-ui,sans-serif;
  word-break:keep-all;overflow-wrap:break-word;overflow:hidden;
  display:flex;align-items:center;justify-content:center}

#device{--fs:1;width:390px;height:844px;position:relative;overflow:hidden;border-radius:42px;
  background:var(--bg);color:var(--ink);box-shadow:0 22px 56px rgba(0,0,0,.55)}
#device[data-fs="1.5"]{--fs:1.5}
#device[data-fs="2"]{--fs:2}
@media (max-width:479px),(max-height:899px){
  body{display:block}
  #device{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
#screens{height:100%}
.screen{height:100%;display:none}
.screen.on{display:block}

/* ── 공통 낱말 ────────────────────────────────────────────────── */
.scr{height:100%;display:flex;flex-direction:column;padding:56px 24px 26px}
.scr.edge{padding-left:0;padding-right:0}
.px{padding-left:24px;padding-right:24px}
.gr{flex:1}
.sc{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

.hd{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.lab,.lab2{font-size:calc(10.5px * var(--fs));line-height:1;color:var(--muted);letter-spacing:.12em}
.tap{font-size:calc(11px * var(--fs));line-height:1;color:var(--muted)}
button.tap{width:auto;text-align:right}
.ser{font-family:'Noto Serif KR',serif;font-weight:400;color:var(--ink)}
.sub{font-size:calc(12.5px * var(--fs));line-height:1.7;color:var(--muted)}
.bd{font-size:calc(13px * var(--fs));line-height:1.7;color:var(--ink)}
.sm{font-size:calc(11px * var(--fs));line-height:1.6;color:var(--muted)}
.acc{color:var(--accent)}
.season{color:var(--season)}
.mono-n{font-weight:700;font-size:calc(34px * var(--fs));line-height:1;color:var(--accent)}
.t-title{font-size:calc(24px * var(--fs));line-height:1.3}
.t-big{font-size:calc(28px * var(--fs));line-height:1.4}
.t-huge{font-size:calc(34px * var(--fs));line-height:1.35}
.t-mid{font-size:calc(22px * var(--fs));line-height:1.45}
.dayline{font-weight:500;font-size:calc(12px * var(--fs));line-height:1;color:var(--accent);letter-spacing:.06em}
.cardsub{font-size:calc(12.5px * var(--fs));line-height:1.6;color:var(--ink)}

/* 조작 — 터치 영역 88px (Q-06b), 라디우스 0, 그림자 0 */
button,input,textarea{font-family:inherit;color:inherit;background:none;border:none;padding:0;margin:0;border-radius:0}
button{cursor:pointer;text-align:left;width:100%;display:block}
.btn{min-height:88px;display:flex;align-items:center;justify-content:center;
  font-weight:500;font-size:calc(15px * var(--fs));line-height:1.3;flex:none;text-align:center;padding:8px 12px}
.btn.p{background:var(--fill);color:var(--on-fill)}
.btn.o{border:1px solid var(--rule2);color:var(--ink)}
.btn.t{color:var(--muted);font-weight:400;font-size:calc(12.5px * var(--fs))}
.btn.dis{background:var(--faint);color:var(--muted);cursor:default}
.btn2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:88px;flex:1;padding:8px}
.btn2 .t1{font-weight:500;font-size:calc(14px * var(--fs));line-height:1.3;color:var(--ink);text-align:center}
.btn2 .t2{font-weight:400;font-size:calc(11px * var(--fs));line-height:1.3;color:var(--muted);text-align:center}
.btn2.on{border:1px solid var(--accent-line);background:var(--accent-bg)}
.btn2.off{border:1px solid var(--rule)}
.btn2.line{border:1px solid var(--rule2)}

.opt{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border:1px solid var(--rule);width:100%}
.opt + .opt{border-top:none}
.opt.on{border:1px solid var(--accent-line);background:var(--accent-bg)}
.opt.on + .opt{border-top:none}
.opt .n{font-weight:500;font-size:calc(14px * var(--fs));line-height:1.35;color:var(--ink)}
.opt .d{font-weight:400;font-size:calc(11px * var(--fs));line-height:1.5;color:var(--muted);margin-top:5px}
.opt .r{font-weight:400;font-size:calc(11px * var(--fs));line-height:1;color:var(--muted);flex:none}
.opt.on .r{color:var(--accent)}
.opt.info{min-height:64px;cursor:default}

.zone{padding:18px 0 16px;border-bottom:1px solid var(--rule)}
.zone:last-child{border-bottom:none}

.ribbon{display:flex;gap:1px}
.ribbon i{flex:1;display:block}
.grid54{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.grid54 i{height:22px;display:block;cursor:pointer}

.plate{flex:none;background-size:cover;background-repeat:no-repeat;box-shadow:inset 0 0 0 2000px var(--plate-veil)}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:15px 0;border-top:1px solid var(--rule)}
.stat .k{font-size:calc(12.5px * var(--fs));line-height:1.3;color:var(--muted)}
.stat .v{font-size:calc(14px * var(--fs));line-height:1.3;color:var(--ink)}

.bar5{display:flex;gap:3px;margin-top:12px}
.bar5 i{flex:1;height:4px;display:block}

.card{padding:24px 0 22px;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.card.pre{opacity:.44}

/* 시트 */
#sheetHost{position:absolute;inset:0;pointer-events:none}
.sheetwrap{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;pointer-events:auto}
.sheet{background:var(--surface);border-top:1px solid var(--rule2);padding:26px 24px 26px;max-height:88%;overflow-y:auto}

/* 기도 화면 */
.prayarea{flex:none;overflow:hidden;padding:16px 24px 0;border-top:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:flex-start}
.pray-lead{font-family:'Noto Serif KR',serif;font-size:calc(26px * var(--fs) * var(--pf,1));line-height:1.7;color:var(--ink)}
.pray-mine{font-family:'Noto Serif KR',serif;font-size:calc(21px * var(--fs) * var(--pf,1));line-height:1.7;color:var(--accent)}
.pray-fold{font-size:calc(15px * var(--fs) * var(--pf,1));line-height:1.6;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prayarea > *{flex:none}   /* 세로 flex 가 줄을 눌러 글자 윗부분을 자르는 것을 막는다 */
.paused{opacity:.38}

/* 초대 코드 여섯 칸 */
.cells{display:flex;gap:8px;margin-top:30px;position:relative}
.cells i{flex:1;height:88px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--rule2);font-weight:500;font-size:calc(28px * var(--fs));line-height:1;
  color:var(--ink);font-style:normal}
.cells i.has{border-color:var(--ink)}
.cells i.cur{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent)}
.cells.err i{border-color:var(--accent-line);color:var(--accent)}
#codeInput{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}

/* 배정표 */
.arow{min-height:64px;display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--rule)}
.arow.mine{background:var(--accent-bg);border-left:2px solid var(--accent-line)}
.arow .dn{width:74px;flex:none;white-space:nowrap;font-size:calc(22px * var(--fs));line-height:1.2;color:var(--muted)}
.arow.mine .dn{font-weight:500;color:var(--accent)}
.arow .nm{flex:1;font-size:calc(14px * var(--fs));line-height:1.4;color:var(--ink)}

/* 새 기도 바람 입력 */
#intentInput{width:100%;font-family:'Noto Serif KR',serif;font-size:calc(23px * var(--fs));
  line-height:1.3;color:var(--ink);margin-top:12px;outline:none;background:none;border:none;resize:none}
#intentInput::placeholder{color:var(--muted)}
input[type="date"]{width:100%;min-height:88px;border:1px solid var(--rule);padding:0 16px;
  font-size:calc(14px * var(--fs));color:var(--ink);background:none}

/* 버전 패널 (앱이 아니라 시연용 손잡이다) */
#verBtn{position:fixed;top:10px;right:10px;width:34px;height:34px;z-index:50;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;color:#8E93A3;background:rgba(7,9,13,.5);border:1px solid rgba(240,234,217,.22)}
#verPanel{position:fixed;top:50px;right:10px;width:280px;max-height:82vh;overflow-y:auto;z-index:50;
  background:#0E141C;border:1px solid rgba(240,234,217,.18);padding:14px 14px 18px;
  font-size:12px;line-height:1.5;color:#D6DAE4}
#verPanel h4{margin:14px 0 6px;font-size:10.5px;font-weight:500;letter-spacing:.1em;color:#8E93A3}
#verPanel h4:first-child{margin-top:0}
#verPanel .seg{display:flex;gap:6px;flex-wrap:wrap}
#verPanel .seg button{flex:1;min-width:64px;width:auto;text-align:center;padding:9px 6px;font-size:11.5px;
  border:1px solid rgba(240,234,217,.2);color:#D6DAE4}
#verPanel .seg button[aria-pressed="true"]{border-color:#D9AE4C;color:#D9AE4C;background:rgba(217,174,76,.1)}

@keyframes bre{0%,100%{opacity:.42;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.22)}}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* 기도문 영역의 높이 — 같은 글자 크기 안에서는 고정(FR-24), 크기 단계가 바뀌면 단계적으로 달라진다.
   150%·200% 에서는 시안 B-7 처럼 성화 도판을 접고 묵주의 꼬리를 접어 기도문에 자리를 내준다. */
.prayarea{height:236px}
#device[data-fs="1.5"] .prayarea,
#device[data-fs="2"] .prayarea{height:auto;flex:1;min-height:0}
#device[data-fs="1.5"] #prayRosary,
#device[data-fs="2"] #prayRosary{flex:none;height:150px}

</style>
</head>

<div id="verPanel" hidden></div>

function pad(n) { return n < 10 ? '0' + n : '' + n; }

    var d = draft; if (!d || !d.intent.trim()) return;
    var j = {
      id: 'j' + Date.now().toString(36), intent: d.intent.trim(), format: d.format, mode: d.mode,
      recite: d.recite, rosary: d.rosary, version: d.version, startDate: d.startDate,
      days: {}, today: null, createdAt: Date.now(),
      group: d.mode === 'group' ? {
        code: makeCode(), owner: true,
        members: [{ name: S.account ? S.account.name : '나', me: true }].concat(VIRTUAL.map(function (n) { return { name: n }; }))
      } : null
    };
    S.journeys.unshift(j); draft = null; save();
    if (dayIndex(j) <= 0) return go('home');
    if (j.mode === 'group') return go('assign', { id: j.id });
    Engine.start(j, { scope: 'all' });
  },
  dformat: function (el) { draft.format = el.getAttribute('data-v'); render(); },
  dmode: function (el) { draft.mode = el.getAttribute('data-v'); render(); },
  drecite: function (el) { draft.recite = el.getAttribute('data-v'); render(); },
  drosary: function (el) { draft.rosary = el.getAttribute('data-v'); closeSheet(); render(); },
  dversion: function (el) { draft.version = el.getAttribute('data-v'); closeSheet(); render(); },
  ddate: function (el) { draft.startDate = el.getAttribute('data-v'); closeSheet(); render(); },
  ddateInput: function () {
    var v = document.getElementById('dateInput');
    if (v && v.value) draft.startDate = v.value;
    closeSheet(); render();
  },
  srecite: function (el) { S.settings.recite = el.getAttribute('data-v'); if (S.settings.recite === 'silent') buzz(VIB.silentOn); save(); render(); },
  space: function (el) { S.settings.pace = el.getAttribute('data-v'); save(); closeSheet(); render(); },
  shands: function () { S.settings.handsFree = !S.settings.handsFree; askMotion(); save(); render(); },
  srosary: function (el) { S.settings.rosary = el.getAttribute('data-v'); save(); closeSheet(); render(); },
  sversion: function (el) { S.settings.version = el.getAttribute('data-v'); save(); closeSheet(); render(); },
  stheme: function (el) { S.settings.theme = el.getAttribute('data-v'); save(); render(); paintPanel(); },
  join: function () {
    var j = lookupCode(codeState.code);
    if (!j) return;
    if (j.id === 'demo') {
      j.id = 'j' + Date.now().toString(36);
      j.group.members = j.group.members.concat([{ name: S.account ? S.account.name : '나', me: true }]);
      S.journeys.unshift(j); save();
    }
    go('assign', { id: j.id });
  },
  sheet: function (el) {
    var k = el.getAttribute('data-v'), f = SHEETS[k];
    if (f) openSheet(f(el.getAttribute('data-id')));
  },
  closeSheet: function () { closeSheet(); },
  closeSheetBg: function (el, ev) { if (ev.target === el) closeSheet(); },
  doRestart: function (el) {
    var j = findJ(el.getAttribute('data-id')); if (!j) return;
    j.today = null; save(); closeSheet(); Engine.start(j, { scope: 'all' });
  },
  doDelete: function (el) {
    var id = el.getAttribute('data-id');
    S.journeys = S.journeys.filter(function (x) { return x.id !== id; });
    save(); closeSheet(); go('home');
  },
  doSignout: function () { S.account = null; save(); closeSheet(); go('login'); },
  doDeleteAccount: function () {
    var keepPrefs = S.prefs;
    S = blank(); S.prefs = keepPrefs; save(); closeSheet(); go('login');
  },
  ppause: function () { Engine.pause(); },
  presume: function () { Engine.resume(); },
  pleave: function () { Engine.leave(); },
  pquit: function () { Engine.quit(); },
  finishJourney: function (el) { go('donejourney', { id: el.getAttribute('data-id') }); },
  day: function (el) {
    var j = findJ(view.p.id); if (!j) return;
    var d = el.getAttribute('data-d'), rec = j.days[d];
    var di = diffDays(j.startDate, d) + 1;
    openSheet(shHead(kdate(d)) +
      '<div class="ser t-mid">' + di + '일째' + (kindOf(j, di) ? ' · ' + kindOf(j, di) : '') + '</div>' +
      (rec && rec.done
        ? '<div class="bd" style="margin-top:12px">' + mysteryName(rec.mystery) + '<br>성모송 ' + (rec.hails || 0) + '번 · ' + Math.max(1, Math.round((rec.ms || 0) / 60000)) + '분' +
        (rec.k != null ? '<br>다섯 중 ' + rec.k : '') + '</div>'
        : '<div class="bd" style="margin-top:12px">' + (d > today() ? '아직 오지 않은 날입니다.' : '바치지 않은 날입니다.') + '</div>') +
      '<button class="btn o" style="margin-top:20px" data-act="closeSheet">닫기</button>');
  }
};
function makeCode() {
  var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '', i;
  for (i = 0; i < 6; i++) s += abc[Math.floor(Math.random() * abc.length)];
  return s;
}
function askMotion() {
  try {
    if (S.settings.handsFree && window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().catch(function () { });
    }
  } catch (e) { }
}
function toast(msg) {
  openSheet('<div class="bd">' + esc(msg) + '</div><button class="btn o" style="margin-top:20px" data-act="closeSheet">닫기</button>');
}

deviceEl.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  var f = ACT[el.getAttribute('data-act')];
  if (f) { ev.preventDefault(); f(el, ev); }
});

/* 카드 길게 누르기 = 여정 삭제 확인 */
var lp = null;
deviceEl.addEventListener('pointerdown', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act="open"]') : null;
  if (!el) return;
  lp = setTimeout(function () {
    lp = null;
    var j = findJ(el.getAttribute('data-id')); if (!j) return;
    var k = j.mode === 'group' ? (j.group.owner ? 'disband' : 'leave') : 'delete';
    openSheet(SHEETS[k](j.id));
  }, 650);
});
['pointerup', 'pointercancel', 'pointermove'].forEach(function (t) {
  deviceEl.addEventListener(t, function () { if (lp) { clearTimeout(lp); lp = null; } });
});

function wireIntent() {
  var i = document.getElementById('intentInput'); if (!i) return;
  i.addEventListener('input', function () {
    draft.intent = i.value;
    var c = document.getElementById('intentCount');
    if (c) c.textContent = i.value.length + ' / 24';
    var btn = document.querySelector('[data-act="create"]');
    if (btn) btn.className = 'btn ' + (i.value.trim() ? 'p' : 'dis');
    var hint = document.getElementById('intentHint');
    if (hint) hint.style.display = i.value.trim() ? 'none' : 'block';
  });
}
function wireCode() {
  var i = document.getElementById('codeInput'); if (!i) return;
  i.focus();
  i.addEventListener('input', function () {
    var v = i.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    codeState.code = v;
    codeState.err = '';
    if (v.length === 6) {
      var j = lookupCode(v);
      if (!j) codeState.err = '이 코드의 기도를 찾지 못했습니다.';
      else if (j.group.members.length >= 5) codeState.err = '이 기도는 다섯 명이 다 모였습니다.';
    }
    render();
  });
}

/* ── 11. 테마·버전 패널 ─────────────────────────────────────── */
var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  var t = S.settings.theme;
  if (t === 'system') t = (mq && mq.matches) ? 'night' : 'day';
  document.documentElement.setAttribute('data-theme', t);
  deviceEl.setAttribute('data-fs', String(S.prefs.fs));
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

var verBtn = document.getElementById('verBtn'), verPanel = document.getElementById('verPanel');
function seg(title, act, items, cur) {
  return '<h4>' + title + '</h4><div class="seg">' + items.map(function (it) {
    return '<button data-vact="' + act + '" data-v="' + it[0] + '" aria-pressed="' + (String(cur) === String(it[0])) + '">' + it[1] + '</button>';
  }).join('') + '</div>';
}
function paintPanel() {
  verPanel.innerHTML =
    seg('색 벌', 'theme', [['day', '한지 낮'], ['night', '쪽빛 밤'], ['system', '기기 따름']], S.settings.theme) +
    seg('묵주 그림', 'art', [['1', '안 1 지금'], ['2', '안 2 실'], ['3', '안 3 전체']], S.prefs.rosaryArt) +
    seg('새 기도의 청원·감사', 'kind', [['ribbon', '리본'], ['line', '문장 한 줄']], S.prefs.kindVariant) +
    seg('새 기도의 묵주 줄', 'row', [['1', '둔다'], ['0', '뺀다']], S.prefs.rosaryRow ? '1' : '0') +
    seg('글자 크기', 'fs', [['1', '보통'], ['1.5', '150%'], ['2', '200%']], S.prefs.fs) +
    '<h4>시험 도구</h4><div class="seg">' +
    '<button data-vact="skip">하루 앞으로 감기</button>' +
    '<button data-vact="wipe">저장한 것 모두 지우기</button></div>' +
    '<div style="margin-top:8px;color:#6E7686;font-size:11px">오늘 ' + today() + (S.dayOffset ? ' (＋' + S.dayOffset + '일)' : '') + '</div>';
}
verBtn.addEventListener('click', function () {
  verPanel.hidden = !verPanel.hidden;
  if (!verPanel.hidden) paintPanel();
});
verPanel.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-vact]') : null;
  if (!el) return;
  var a = el.getAttribute('data-vact'), v = el.getAttribute('data-v');
  if (a === 'theme') S.settings.theme = v;
  else if (a === 'art') S.prefs.rosaryArt = +v;
  else if (a === 'kind') S.prefs.kindVariant = v;
  else if (a === 'row') S.prefs.rosaryRow = v === '1';
  else if (a === 'fs') S.prefs.fs = +v;
  else if (a === 'skip') { S.dayOffset = (S.dayOffset || 0) + 1; }
  else if (a === 'wipe') {
    try { localStorage.removeItem(KEY); } catch (e) { }
    S = blank(); mem = S; Engine.s = null; save(); applyTheme(); paintPanel(); return go('login');
  }
  save(); applyTheme(); paintPanel();
  if (view.name === 'pray' && Engine.s) Engine.paint(); else render();
});

/* ── 12. 시작 ────────────────────────────────────────────────── */
applyTheme();
go(S.account ? 'home' : 'login');

})();

</script>
</body>
</html>
